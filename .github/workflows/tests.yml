name: Worker smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r builder/requirements.txt pytest pytest-asyncio
      - run: python -m py_compile src/handler.py
      - run: pytest -q tests/
